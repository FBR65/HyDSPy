[project]
name = "hydspy"
version = "0.1.0"
description = "HyDE-RAG System mit DSPy und LanceDB"
authors = [
    {name = "Entwickler", email = "entwickler@example.com"},
]
dependencies = [
    "dspy-ai>=2.0.0",
    "lancedb>=0.10.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "rank-bm25>=0.2.2",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: Tests die echte externe Dienste benötigen (Ollama, etc.)",
]