[project]
name = "hydspy"
version = "0.1.0"
description = "HyDE-RAG system with DSPy and LanceDB"
authors = [
    {name = "Entwickler", email = "entwickler@example.com"},
]
dependencies = [
    "dspy-ai>=2.0.0",
    "lancedb>=0.10.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "rank-bm25>=0.2.2",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
keywords = ["rag", "hyde", "dspy", "lancedb", "bm25", "agentic-rag", "retrieval-augmented-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://example.com/hydspy"
"Repository" = "https://example.com/hydspy"
"Issues" = "https://example.com/hydspy/issues"

[project.scripts]
hydspy = "src.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E203"]
exclude = [".venv", "__pycache__", ".git", "*.egg-info", "build", "dist", ".pytest_cache"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: tests that require real external services (Ollama, etc.)",
]
