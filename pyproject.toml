[project]
name = "hydspy"
version = "0.1.0"
description = "HyDE-RAG System mit DSPy und LanceDB"
authors = [
    {name = "Entwickler", email = "entwickler@example.com"},
]
dependencies = [
    "dspy-ai>=2.0.0",
    "lancedb>=0.10.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]